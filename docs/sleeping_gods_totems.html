<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sleeping Gods — Totems</title>
    <link rel="stylesheet" href="./styles.css?v=32">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        table { border-collapse: collapse; width: 100%; }
        td { padding: 6px; vertical-align: middle; }
        td input[type="checkbox"] { margin-right: 6px; }
    </style>
</head>
<body>

<div class="form-container" id="tabbar">
    <h1 style="margin:0 0 10px;">Board Game Logger</h1>
    <div id="tabbar-mount"></div>
</div>

    <button class="btn-back" style="margin:0 0 0 20px;" onclick="window.location.href='./sleeping_gods.html'">← Back to Sleeping Gods</button>

    <div class="form-container">
        <h2>Totems</h2>
        <table><tbody id="totems-body"></tbody></table>
    </div>

    <div class="form-container">
        <h2>Endings</h2>
        <table><tbody id="endings-body"></tbody></table>
    </div>

    <div class="form-container">
        <h2>Unlocked Cards</h2>
        <p>You've uncovered <strong id="totem-count">0</strong> totems and endings. Include ticked Quests below in all future campaigns.</p>
        <table><tbody id="unlocked-body"></tbody></table>
    </div>

    <footer>Background image: © Ryan Laukat / Red Raven Games — used with appreciation.</footer>

    <script src="./config.js"></script>
    <script src="./api.js"></script>
    <script src="./tabs.js?v=32"></script>
    <script>
        requireAuth();
        renderTabs('games');

        let allTotems = [];

        // Totems and endings count towards unlocking cards; the cards
        // themselves don't count towards their own thresholds. The server
        // sends a category per row, so this no longer guesses from the name.
        function countChecked() {
            return allTotems.filter(t => t.found && t.category !== 'unlocked').length;
        }

        function refreshCount() {
            document.getElementById('totem-count').textContent = countChecked();
        }

        async function toggleTotem(id, isFound) {
            allTotems.find(t => t.id === id).found = isFound;
            refreshCount();
            checkUnlocks();
            await apiPost('/sleeping_gods_totems_update', { totemId: id, isFound });
        }

        function renderGrid(bodyId, items) {
            const tbody = document.getElementById(bodyId);
            const rows = [];
            for (let i = 0; i < items.length; i += 3) {
                const cells = items.slice(i, i + 3).map(t => {
                    if (!t) return '<td></td>';
                    return `<td>
                        <input type="checkbox" id="t-${t.id}" data-id="${t.id}" ${t.found ? 'checked' : ''}>
                        <label for="t-${t.id}">${t.totem}</label>
                    </td>`;
                });
                while (cells.length < 3) cells.push('<td></td>');
                rows.push('<tr>' + cells.join('') + '</tr>');
            }
            tbody.innerHTML = rows.join('');
            tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', () => toggleTotem(parseInt(cb.dataset.id), cb.checked));
            });
        }

        // Ticks any card whose threshold the count has reached. Driven by each
        // card's own unlocks_at — the number in its name — rather than a table
        // of hardcoded row ids, which were one account's and would have ticked
        // the wrong boxes for anybody else.
        function checkUnlocks() {
            const c = countChecked();
            allTotems
                .filter(t => t.category === 'unlocked' && !t.found && c >= t.unlocks_at)
                .forEach(card => {
                    const cb = document.getElementById('t-' + card.id);
                    if (cb) cb.checked = true;
                    toggleTotem(card.id, true);
                    alert(`Congratulations! You have ${c} totems/endings — ${card.totem} unlocked!`);
                });
        }

        async function load() {
            const data = await apiGet('/api/sleeping_gods_totems_data');
            if (!data) return;
            allTotems = data.totems;
            // Grouped by what each row is, not by where it sits in the list.
            // The old slice(0,75)/slice(75,83) broke the moment anything was
            // reordered or a row was added by hand.
            const of = c => allTotems.filter(t => t.category === c);
            renderGrid('totems-body',   of('totem'));
            renderGrid('unlocked-body', of('unlocked').sort((a, b) => a.unlocks_at - b.unlocks_at));
            renderGrid('endings-body',  of('ending').sort((a, b) => a.unlocks_at - b.unlocks_at));
            refreshCount();
        }
        load();
    </script>
</body>
</html>
