<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ares Expedition</title>
    <link rel="stylesheet" href="./styles.css?v=24">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        .wrap { overflow-x: auto; }
        table.ares { border-collapse: collapse; width: 100%; min-width: 420px; }
        table.ares th, table.ares td { padding: 7px 6px; }
        table.ares thead th {
            font-size: 0.74em; color: #aaa; font-weight: normal; text-align: center;
        }
        table.ares thead th.left { text-align: left; }
        table.ares tbody tr { border-bottom: 1px solid rgba(255,255,255,0.07); }
        .date { white-space: nowrap; font-size: 0.85em; }
        .num { text-align: center; font-variant-numeric: tabular-nums; width: 42px; }
        .won  { color: #90EE90; font-weight: bold; }
        .lost { color: #FF8A80; }
        /* A parameter that reached its target is done; short of it is the gap. */
        .hit  { color: #90EE90; }
        .miss { color: #FF8A80; }
        .botcol { color: #999; }
        .sep { border-left: 1px solid rgba(255,255,255,0.16); }
        .caption { color: #ccc; font-size: 0.9em; margin: 0 0 4px; }
        .aside { color: #888; font-size: 0.82em; margin: 10px 0 0; }
        .headline { margin: 12px 0 0; padding: 9px 11px; border-left: 3px solid #FFD54F;
                    background: rgba(255,213,79,0.07); font-size: 0.9em; }
        .note { color: #aaa; font-size: 0.8em; }
        /* Progress chart. Hand-drawn SVG rather than a library: the page has
           to work offline and the shape is simple enough not to need one. */
        .chart-wrap { margin: 4px 0 2px; }
        .chart-wrap svg { width: 100%; height: auto; display: block; }
        .axis { stroke: rgba(255,255,255,0.18); stroke-width: 1; }
        .grid { stroke: rgba(255,255,255,0.08); stroke-width: 1; }
        .tick { fill: #888; font-size: 7px; }
        .trend { fill: none; stroke: rgba(255,213,79,0.55); stroke-width: 1.5; }
        .pt-won  { fill: #90EE90; }
        .pt-lost { fill: #FF8A80; }
        .chart-note { color: #888; font-size: 0.78em; margin: 2px 0 12px; }
        .chart-note span { margin-right: 12px; white-space: nowrap; }
    </style>
</head>
<body>

<div class="form-container" id="tabbar">
    <h1 style="margin:0 0 10px;">Board Game Logger</h1>
    <div id="tabbar-mount"></div>
</div>

    <div class="form-container">
        <h2>Ares Expedition</h2>
        <p class="caption">Where each finished game ended up. Terraformed is
           <strong>8&deg;C, 14% oxygen, 9 oceans</strong> — green means that
           parameter got there.</p>
        <div id="body"><p style="color:#aaa;">Loading...</p></div>
    </div>

    <footer>Background image: © Ryan Laukat / Red Raven Games — used with appreciation.</footer>

    <script src="./config.js"></script>
    <script src="./api.js"></script>
    <script src="./tabs.js?v=24"></script>
    <script>
        requireAuth();
        renderTabs('games');

        const esc = s => String(s ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        function num(value, target) {
            if (value === null || value === undefined) return '<td class="num">·</td>';
            const cls = target !== undefined && value >= target ? 'hit' : 'miss';
            return `<td class="num ${cls}">${value}</td>`;
        }

        // Steps short of a terraformed board, over time. Zero sits at the TOP:
        // the whole point is how close you are getting, so a line climbing the
        // chart is a run of games getting nearer, which is the way round you
        // want to read it.
        function drawChart(games) {
            const W = 320, H = 150, L = 22, R = 6, T = 8, B = 18;
            const maxShort = Math.max(4, ...games.map(g => g.shortfall));
            const x = i => games.length === 1 ? L + (W - L - R) / 2
                : L + i * (W - L - R) / (games.length - 1);
            const y = v => T + (v / maxShort) * (H - T - B);

            const gridlines = [0, Math.round(maxShort / 2), maxShort].map(v => `
                <line class="grid" x1="${L}" y1="${y(v).toFixed(1)}"
                      x2="${W - R}" y2="${y(v).toFixed(1)}"/>
                <text class="tick" x="${L - 3}" y="${(y(v) + 2.5).toFixed(1)}"
                      text-anchor="end">${v}</text>`).join('');

            const line = games.map((g, i) => `${x(i).toFixed(1)},${y(g.shortfall).toFixed(1)}`).join(' ');
            const dots = games.map((g, i) => `
                <circle class="${g.won ? 'pt-won' : 'pt-lost'}" r="3"
                        cx="${x(i).toFixed(1)}" cy="${y(g.shortfall).toFixed(1)}">
                    <title>${esc(g.date)} — ${g.won ? 'won' : 'lost'}, ${g.shortfall} short</title>
                </circle>`).join('');

            const first = games[0].date.slice(0, 7), last = games[games.length - 1].date.slice(0, 7);
            return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img"
                        aria-label="Steps short of terraformed, over time">
                    ${gridlines}
                    <line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/>
                    <polyline class="trend" points="${line}"/>
                    ${dots}
                    <text class="tick" x="${L}" y="${H - 6}">${esc(first)}</text>
                    <text class="tick" x="${W - R}" y="${H - 6}" text-anchor="end">${esc(last)}</text>
                </svg></div>
                <p class="chart-note">
                    <span>Steps short of terraformed — nearer the top is closer.</span>
                    <span><span class="pt-won" style="font-size:1.2em;">●</span> won</span>
                    <span><span class="pt-lost" style="font-size:1.2em;">●</span> lost</span></p>`;
        }

        async function load() {
            const data = await apiGet('/api/ares_stats');
            const body = document.getElementById('body');
            if (!data) return;
            if (data.success === false) {
                body.innerHTML = `<p class="status-err">${esc(data.message || 'Not allowed.')}</p>`;
                return;
            }
            if (!data.games.length) {
                body.innerHTML = '<p class="aside">No finished games recorded yet.</p>';
                return;
            }

            const t = data.target;

            // How close each finish got, oldest first. Only games where all
            // three parameters were recorded have a shortfall to plot.
            const plotted = data.games.filter(g => g.shortfall !== null).reverse();
            const chart = plotted.length >= 2 ? drawChart(plotted) : '';

            const rows = data.games.map(g => `<tr>
                <td class="date">${esc(g.date)}</td>
                <td class="${g.won ? 'won' : 'lost'}">${g.won ? 'Won' : 'Lost'}</td>
                <td class="note">${esc(g.difficulty || '')}</td>
                ${num(g.me.temp, t.temp)}${num(g.me.oxygen, t.oxygen)}${num(g.me.oceans, t.oceans)}
                <td class="num">${g.me.mc ?? ''}</td>
                <td class="num sep">${g.shortfall ?? ''}</td>
            </tr>`).join('');

            // Closest finish is the most useful single number here: it says how
            // near the board got, which win/loss alone doesn't.
            const withGap = data.games.filter(g => g.shortfall !== null);
            const closest = withGap.length
                ? Math.min(...withGap.map(g => g.shortfall)) : null;

            const headline = `<p class="headline">
                ${data.won} won, ${data.lost} lost of ${data.total_games} finished games.
                Best reached: ${data.best.temp ?? '–'}°C, ${data.best.oxygen ?? '–'}% oxygen,
                ${data.best.oceans ?? '–'} oceans.
                ${closest !== null ? `Closest finish was ${closest} step${closest === 1 ? '' : 's'} short.` : ''}</p>`;

            // A finished game with only some parameters recorded can't be
            // placed on the chart; say so rather than letting the line look
            // like the whole story.
            const missing = data.total_games - plotted.length;
            const chartGap = missing
                ? `<p class="chart-note">${missing} finished
                     ${missing === 1 ? 'game is' : 'games are'} missing a parameter,
                     so ${missing === 1 ? 'it is' : 'they are'} not on the chart.</p>`
                : '';

            const gap = data.total_plays > data.total_games
                ? `<p class="aside">${data.total_plays - data.total_games} sittings weren't
                     finished, so they have no end state and aren't listed.</p>`
                : '';

            body.innerHTML = chart + chartGap +
                `<div class="wrap"><table class="ares">
                    <thead>
                        <tr><th class="left">Date</th><th></th><th>Diff</th>
                            <th>°C</th><th>O₂</th><th>Oc</th><th>MC</th>
                            <th class="sep">Short by</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                 </table></div>` + headline + gap;
        }
        load();
    </script>
</body>
</html>
