<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ares Expedition</title>
    <link rel="stylesheet" href="./styles.css?v=35">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        /* Its own scroll box, vertical as well as horizontal: a sticky header
           anchors to the nearest scrolling ancestor, and the horizontal-scroll
           wrapper was already that — so page scroll would never have moved it. */
        .wrap { max-height: 66vh; overflow: auto; }
        table.ares { border-collapse: collapse; width: 100%; min-width: 420px; }
        table.ares th, table.ares td { padding: 7px 6px; }
        table.ares thead th {
            font-size: 0.74em; color: #aaa; font-weight: normal; text-align: center;
            position: sticky; top: 0; z-index: 1;
            background: #1b1b1b; box-shadow: 0 1px 0 rgba(255,255,255,0.18);
        }
        /* The number each column is aiming at, kept in view while you scroll. */
        .tgt { display: block; color: #FFD54F; font-weight: bold; font-size: 1.05em; }
        .tgt-none { display: block; color: #555; font-size: 1.05em; }
        table.ares thead th.left { text-align: left; }
        table.ares tbody tr { border-bottom: 1px solid rgba(255,255,255,0.07); }
        .date { white-space: nowrap; font-size: 0.85em; }
        .num { text-align: center; font-variant-numeric: tabular-nums; width: 42px; }
        .won  { color: #90EE90; font-weight: bold; }
        .lost { color: #FF8A80; }
        /* A parameter that reached its target is done; short of it is the gap. */
        .hit  { color: #90EE90; }
        .miss { color: #FF8A80; }
        .botcol { color: #999; }
        .sep { border-left: 1px solid rgba(255,255,255,0.16); }
        .caption { color: #ccc; font-size: 0.9em; margin: 0 0 4px; }
        .aside { color: #888; font-size: 0.82em; margin: 10px 0 0; }
        .headline { margin: 12px 0 0; padding: 9px 11px; border-left: 3px solid #FFD54F;
                    background: rgba(255,213,79,0.07); font-size: 0.9em; }
        .note { color: #aaa; font-size: 0.8em; }
        /* Progress chart. Hand-drawn SVG rather than a library: the page has
           to work offline and the shape is simple enough not to need one. */
        .chart-wrap { margin: 4px 0 2px; }
        .chart-wrap svg { width: 100%; height: auto; display: block; }
        .axis { stroke: rgba(255,255,255,0.18); stroke-width: 1; }
        .grid { stroke: rgba(255,255,255,0.08); stroke-width: 1; }
        .tick { fill: #888; font-size: 7px; }
        .series { fill: none; stroke-width: 1.2; }
        .faint { opacity: 0.35; }
        .total { fill: none; stroke: #FFD54F; stroke-width: 2.2; }
        .total-dot { fill: #FFD54F; }
        .grid-target { stroke: rgba(144,238,144,0.35); stroke-width: 1; stroke-dasharray: 3 2; }
        .winmark { fill: #90EE90; }
        .winmark-key { color: #90EE90; }
        .faint-key { opacity: 0.6; }
        .chart-note { color: #888; font-size: 0.78em; margin: 2px 0 12px; }
        .chart-head { margin: 14px 0 2px; font-size: 0.9em; color: #fff; }
        .chart-count { color: #888; font-size: 0.8em; font-weight: normal; margin-left: 6px; }
        .chart-note span { margin-right: 12px; white-space: nowrap; }
    </style>
</head>
<body>

<div class="form-container" id="tabbar">
    <h1 style="margin:0 0 10px;">Board Game Logger</h1>
    <div id="tabbar-mount"></div>
</div>

    <div class="form-container">
        <h2>Ares Expedition</h2>
        <p class="caption">Where each finished game ended up. The yellow figures
           are the targets; green means that parameter got there.</p>
        <div id="body"><p style="color:#aaa;">Loading...</p></div>
    </div>

    <footer>Background image: © Ryan Laukat / Red Raven Games — used with appreciation.</footer>

    <script src="./config.js"></script>
    <script src="./api.js"></script>
    <script src="./tabs.js?v=35"></script>
    <script>
        requireAuth();
        renderTabs('games');

        const esc = s => String(s ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        function num(value, target) {
            if (value === null || value === undefined) return '<td class="num">·</td>';
            const cls = target !== undefined && value >= target ? 'hit' : 'miss';
            return `<td class="num ${cls}">${value}</td>`;
        }

        // Each global parameter as a percentage of its own target, because the
        // three run on different scales — temperature -30 to +8, oxygen 0 to
        // 14, oceans 0 to 9 — and raw values on one axis would let temperature
        // swamp the other two. 100% means that parameter was finished.
        // Colours are the page's business; the ranges belong to the server,
        // which also computes the average shown in the table — so the two can't
        // disagree about what 100% means.
        const COLOURS = { temp: '#FF8A65', oxygen: '#90CAF9', oceans: '#4DD0E1' };
        let PARAMS = [];

        const pct = (p, value) =>
            Math.max(0, Math.min(100, ((value - p.from) / (p.to - p.from)) * 100));

        function drawChart(games) {
            const W = 320, H = 155, L = 24, R = 6, T = 8, B = 18;
            const x = i => games.length === 1 ? L + (W - L - R) / 2
                : L + i * (W - L - R) / (games.length - 1);
            const y = v => T + (1 - v / 100) * (H - T - B);

            const gridlines = [0, 50, 100].map(v => `
                <line class="${v === 100 ? 'grid-target' : 'grid'}"
                      x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}"/>
                <text class="tick" x="${L - 3}" y="${(y(v) + 2.5).toFixed(1)}"
                      text-anchor="end">${v}%</text>`).join('');

            // The three parameters, faint. They're the detail behind the total —
            // useful for spotting which one lags, but not the thing being read.
            const series = PARAMS.map(p => {
                const pts = games.map((g, i) => g.me[p.key] === null || g.me[p.key] === undefined
                    ? null : { x: x(i), y: y(pct(p, g.me[p.key])), g });
                const runs = [];
                let run = [];
                pts.forEach(pt => { if (pt) { run.push(pt); } else if (run.length) { runs.push(run); run = []; } });
                if (run.length) runs.push(run);
                const lines = runs.map(r =>
                    `<polyline class="series faint" stroke="${p.colour}"
                               points="${r.map(q => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' ')}"/>`).join('');
                const dots = pts.filter(Boolean).map(q => `
                    <circle class="faint" r="2" fill="${p.colour}"
                            cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}">
                        <title>${esc(q.g.date)} — ${esc(p.label)} ${q.g.me[p.key]}${p.key === 'oxygen' ? '%' : ''}</title>
                    </circle>`).join('');
                return lines + dots;
            }).join('');

            // The total, which is what the chart is for. Drawn over the top and
            // broken wherever a game didn't record all three, since there is no
            // honest total for those.
            const totalPts = games.map((g, i) => g.progress === null || g.progress === undefined
                ? null : { x: x(i), y: y(g.progress), g });
            const totalRuns = [];
            let tr = [];
            totalPts.forEach(pt => { if (pt) { tr.push(pt); } else if (tr.length) { totalRuns.push(tr); tr = []; } });
            if (tr.length) totalRuns.push(tr);
            const total = totalRuns.map(r =>
                `<polyline class="total" points="${r.map(q => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' ')}"/>`
            ).join('') + totalPts.filter(Boolean).map(q => `
                <circle class="total-dot" r="3.2" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}">
                    <title>${esc(q.g.date)} — ${q.g.progress}% achieved${q.g.won ? ', won' : ''}</title>
                </circle>`).join('');

            // A win is marked on the axis rather than by recolouring a point —
            // the colours are already saying which parameter is which.
            const wins = games.map((g, i) => g.won
                ? `<polygon class="winmark" points="${x(i).toFixed(1)},${H - B + 1}
                     ${(x(i) - 3).toFixed(1)},${H - B + 6} ${(x(i) + 3).toFixed(1)},${H - B + 6}"/>`
                : '').join('');

            const first = games[0].date.slice(0, 7), last = games[games.length - 1].date.slice(0, 7);
            return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img"
                        aria-label="Each global parameter as a percentage of its target, over time">
                    ${gridlines}
                    <line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${H - B}"/>
                    ${series}${total}${wins}
                    <text class="tick" x="${L}" y="${H - 4}">${esc(first)}</text>
                    <text class="tick" x="${W - R}" y="${H - 4}" text-anchor="end">${esc(last)}</text>
                </svg></div>
                <p class="chart-note">
                    <span><span style="color:#FFD54F; font-size:1.3em;">●</span>
                        <strong>Total achieved</strong></span>
                    ${PARAMS.map(p => `<span class="faint-key"><span
                        style="color:${p.colour}; font-size:1.2em;">●</span>
                        ${esc(p.label)}</span>`).join('')}
                    <span><span class="winmark-key">▲</span> won</span></p>`;
        }

        async function load() {
            const data = await apiGet('/api/ares_stats');
            const body = document.getElementById('body');
            if (!data) return;
            if (data.success === false) {
                body.innerHTML = `<p class="status-err">${esc(data.message || 'Not allowed.')}</p>`;
                return;
            }
            if (!data.games.length) {
                body.innerHTML = '<p class="aside">No finished games recorded yet.</p>';
                return;
            }

            const t = data.target;

            // How close each finish got, oldest first. Only games where all
            // three parameters were recorded have a shortfall to plot.
            PARAMS = Object.entries(data.params).map(([key, p]) =>
                ({ key, label: p.label, from: p.from, to: p.to, colour: COLOURS[key] }));
            const plotted = data.games.filter(g =>
                PARAMS.some(p => g.me[p.key] !== null && g.me[p.key] !== undefined)).reverse();

            // Split by level: a run at Expert and a run at Advanced are
            // different climbs, and one line through both would compare things
            // that aren't comparable.
            const groups = new Map();
            plotted.forEach(g => {
                const key = g.level || 'Level not recorded';
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(g);
            });
            const ordered = [...groups.entries()].sort((a, b) => {
                // Unlabelled games last; otherwise most-played first.
                const un = k => k.startsWith('Level not') ? 1 : 0;
                return un(a[0]) - un(b[0]) || b[1].length - a[1].length;
            });

            // A single game is a dot, not a trend, so it's named rather than
            // drawn — otherwise the page fills with one-point charts.
            const single = ordered.filter(([, g]) => g.length < 2);
            const chart = ordered.filter(([, g]) => g.length >= 2)
                .map(([name, g]) => `<h3 class="chart-head">${esc(name)}
                    <span class="chart-count">${g.length} games</span></h3>` + drawChart(g))
                .join('') +
                (single.length
                    ? `<p class="chart-note">${single.map(([name, g]) =>
                        `${esc(name)}: one game only (${g[0].progress ?? '–'}%), not charted`)
                        .join(' · ')}</p>`
                    : '');

            const rows = data.games.map(g => `<tr>
                <td class="date">${esc(g.date)}</td>
                <td class="${g.won ? 'won' : 'lost'}">${g.won ? 'Won' : 'Lost'}</td>
                <td class="note">${esc(g.level || '')}</td>
                ${num(g.me.temp, t.temp)}${num(g.me.oxygen, t.oxygen)}${num(g.me.oceans, t.oceans)}
                <td class="num">${g.me.mc ?? ''}</td>
                <td class="num sep ${g.progress === 100 ? 'hit' : ''}">${
                    g.progress === null ? '' : g.progress + '%'}</td>
            </tr>`).join('');

            // Closest finish is the most useful single number here: it says how
            // near the board got, which win/loss alone doesn't.
            // Losses only. Every win is 100% by definition now, so "closest
            // finish" would read 100% forever the moment you'd won once — the
            // number worth knowing is how near the ones that got away came.
            const nearMisses = data.games.filter(g => !g.won && g.progress !== null);
            const closest = nearMisses.length
                ? Math.max(...nearMisses.map(g => g.progress)) : null;

            const headline = `<p class="headline">
                ${data.won} won, ${data.lost} lost of ${data.total_games} finished games.
                Best reached: ${data.best.temp ?? '–'}°C, ${data.best.oxygen ?? '–'}% oxygen,
                ${data.best.oceans ?? '–'} oceans.
                ${closest !== null ? `The nearest miss got <strong>${closest}%</strong> of the way.` : ''}</p>`;

            // A finished game with only some parameters recorded can't be
            // placed on the chart; say so rather than letting the line look
            // like the whole story.
            const missing = data.total_games - plotted.length;
            const chartGap = missing
                ? `<p class="chart-note">${missing} finished
                     ${missing === 1 ? 'game is' : 'games are'} missing a parameter,
                     so ${missing === 1 ? 'it is' : 'they are'} not on the chart.</p>`
                : '';

            const gap = data.total_plays > data.total_games
                ? `<p class="aside">${data.total_plays - data.total_games} sittings weren't
                     finished, so they have no end state and aren't listed.</p>`
                : '';

            body.innerHTML = chart + chartGap +
                `<div class="wrap"><table class="ares">
                    <thead>
                        <tr><th class="left">Date</th><th></th><th>Level</th>
                            <th>°C<span class="tgt">${t.temp}</span></th>
                            <th>O₂<span class="tgt">${t.oxygen}</span></th>
                            <th>Oc<span class="tgt">${t.oceans}</span></th>
                            <th>MC<span class="tgt-none">—</span></th>
                            <th class="sep">Achieved<span class="tgt">100%</span></th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                 </table></div>` + headline + gap;
        }
        load();
    </script>
</body>
</html>
