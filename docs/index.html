<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Board Game Logger — Login</title>
    <link rel="stylesheet" href="./styles.css?v=30">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        .switch { margin-top:14px; font-size:0.85em; color:#bbb; }
        .switch a { color:#90CAF9; cursor:pointer; text-decoration:underline; }
    </style>
</head>
<body>
    <div class="form-container" style="max-width:360px; margin-top:60px;">
        <h1>Board Game Logger</h1>

        <div id="login-form">
            <label for="email">Email:</label>
            <input type="email" id="email" autocomplete="username" placeholder="you@example.com">
            <label for="password">Password:</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="Password">
            <button id="login-btn">Login</button>
            <p class="switch">No account? <a id="show-signup">Request one</a></p>
        </div>

        <div id="signup-form" style="display:none;">
            <label for="su-name">Name:</label>
            <input type="text" id="su-name" autocomplete="name" placeholder="What should we call you?">
            <label for="su-email">Email:</label>
            <input type="email" id="su-email" autocomplete="username" placeholder="you@example.com">
            <label for="su-password">Password:</label>
            <input type="password" id="su-password" autocomplete="new-password" placeholder="At least 8 characters">
            <button id="signup-btn">Request an account</button>
            <p class="switch">New accounts are approved by hand, so this isn't instant.</p>
            <p class="switch">Already have one? <a id="show-login">Log in</a></p>
        </div>

        <p id="error-msg" class="status-err" style="display:none;"></p>
        <p id="ok-msg" class="status-ok" style="display:none;"></p>
    </div>

    <footer>Background image: © Ryan Laukat / Red Raven Games — used with appreciation.</footer>

    <script src="./config.js"></script>
    <script>
        if (localStorage.getItem('bg_token')) window.location.href = './dashboard.html';

        const err = document.getElementById('error-msg');
        const okMsg = document.getElementById('ok-msg');
        const show = (el, text) => { el.textContent = text; el.style.display = ''; };
        const clearMsgs = () => { err.style.display = 'none'; okMsg.style.display = 'none'; };

        function swap(toSignup) {
            clearMsgs();
            document.getElementById('login-form').style.display = toSignup ? 'none' : '';
            document.getElementById('signup-form').style.display = toSignup ? '' : 'none';
        }
        document.getElementById('show-signup').addEventListener('click', () => swap(true));
        document.getElementById('show-login').addEventListener('click', () => swap(false));

        async function send(path, body) {
            const resp = await fetch(API_BASE + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return resp.json();
        }

        async function doLogin() {
            const btn = document.getElementById('login-btn');
            clearMsgs();
            btn.disabled = true; btn.textContent = 'Logging in...';
            try {
                const data = await send('/api/login', {
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value
                });
                if (data.success) {
                    localStorage.setItem('bg_token', data.token);
                    window.location.href = './dashboard.html';
                    return;
                }
                show(err, data.message || 'Wrong email or password');
            } catch (e) {
                show(err, 'Cannot reach server — is it online?');
            }
            btn.disabled = false; btn.textContent = 'Login';
        }

        async function doSignup() {
            const btn = document.getElementById('signup-btn');
            clearMsgs();
            btn.disabled = true; btn.textContent = 'Sending...';
            try {
                const data = await send('/api/signup', {
                    display_name: document.getElementById('su-name').value.trim(),
                    email: document.getElementById('su-email').value.trim(),
                    password: document.getElementById('su-password').value,
                    // Which zone this account's days are measured in. Without
                    // it everyone gets the server's, and "played today" is
                    // wrong for anyone not in New Zealand.
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                });
                if (data.success) {
                    swap(false);
                    show(okMsg, data.message);
                } else {
                    show(err, data.message || 'Could not create the request.');
                }
            } catch (e) {
                show(err, 'Cannot reach server — is it online?');
            }
            btn.disabled = false; btn.textContent = 'Request an account';
        }

        document.getElementById('login-btn').addEventListener('click', doLogin);
        document.getElementById('signup-btn').addEventListener('click', doSignup);
        ['email', 'password'].forEach(id =>
            document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
        ['su-name', 'su-email', 'su-password'].forEach(id =>
            document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); }));
    </script>
</body>
</html>
