<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Games Ranked</title>
    <link rel="stylesheet" href="./styles.css?v=8">
    <link rel="apple-touch-icon" href="./favicon.png">
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        #games-table { border-collapse: collapse; width: 100%; }
        #games-table th, #games-table td {
            padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;
        }
        #games-table th {
            cursor: pointer; user-select: none; white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            position: sticky; top: 0; background: #1b1b1b;
        }
        #games-table th:hover { color: #90EE90; }
        #games-table th .arrow { color: #4CAF50; font-size: 0.8em; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .note { font-size: 0.85em; color: #ccc; }
        .hint { color: #888; font-size: 0.8em; margin: 0 0 10px; }
    </style>
</head>
<body>

<div class="form-container" id="tabbar">
    <h1 style="margin:0 0 10px;">Board Game Logger</h1>
    <div id="tabbar-mount"></div>
</div>

    <div class="form-container">
        <h2>All Games Ranked</h2>
        <p class="hint">Tap a heading to sort; tap it again to reverse.</p>
        <table id="games-table">
            <thead>
                <tr>
                    <th data-sort="rank" class="num">Rank</th>
                    <th data-sort="game">Game</th>
                    <th data-sort="play_count" class="num">Plays</th>
                    <th data-sort="latest_note">Latest Note</th>
                </tr>
            </thead>
            <tbody id="games-body">
                <tr><td colspan="4" style="color:#aaa;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <footer>Background image: © Ryan Laukat / Red Raven Games — used with appreciation.</footer>

    <script src="./config.js"></script>
    <script src="./api.js"></script>
    <script src="./tabs.js?v=8"></script>
    <script>
        requireAuth();
        renderTabs('games');

        const esc = s => String(s ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        let games = [];
        let sortKey = 'rank';
        let ascending = true;

        function render() {
            const numeric = sortKey === 'rank' || sortKey === 'play_count';
            const rows = [...games].sort((a, b) => {
                const x = a[sortKey], y = b[sortKey];
                if (numeric) return ascending ? x - y : y - x;
                // Blank notes sort last either way, rather than clumping at the top.
                const sx = (x || '').toString(), sy = (y || '').toString();
                if (!sx && sy) return 1;
                if (sx && !sy) return -1;
                return ascending ? sx.localeCompare(sy) : sy.localeCompare(sx);
            });

            document.querySelectorAll('#games-table th').forEach(th => {
                const active = th.dataset.sort === sortKey;
                th.innerHTML = th.textContent.replace(/[ ▲▼]+$/, '') +
                    (active ? ` <span class="arrow">${ascending ? '▲' : '▼'}</span>` : '');
            });

            document.getElementById('games-body').innerHTML = rows.map(g => `
                <tr>
                    <td class="num">${g.rank}</td>
                    <td>${esc(g.game)}</td>
                    <td class="num">${g.play_count}</td>
                    <td class="note">${esc(g.latest_note)}</td>
                </tr>`).join('');
        }

        document.querySelectorAll('#games-table th').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.sort;
                // Same column again reverses; a new column starts ascending,
                // except the counts, where you almost always want most-first.
                if (key === sortKey) ascending = !ascending;
                else { sortKey = key; ascending = key !== 'play_count'; }
                render();
            });
        });

        async function load() {
            const data = await apiGet('/api/all_games');
            if (!data) return;
            games = data;
            if (!games.length) {
                document.getElementById('games-body').innerHTML =
                    '<tr><td colspan="4">No games found.</td></tr>';
                return;
            }
            render();
        }
        load();
    </script>
</body>
</html>
